name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install tools
        run: make setup
      - name: Build the fonts
        run: make build
      - name: Check the committed fonts match the source
        run: |
          git status --short -- fonts
          test -z "$(git status --porcelain -- fonts)" || {
            echo "::error::fonts/ differs from what the generator builds. Run make build and commit fonts/."
            exit 1
          }
      - name: Tests
        run: make test
      - name: Spacing audit
        run: .venv/bin/python generator/check_spacing.py
      - name: Font Bakery
        # One folder at a time, because the family checks treat every file
        # passed together as one family.
        run: make fontbakery

  glyph-diff:
    # Before-and-after images of every glyph the pull request changes, so a
    # reviewer sees the shapes and not just "binary file changed".
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch the base commit
        run: git fetch --no-tags --depth=1 origin ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install tools
        run: make setup
      - name: Compare glyphs with the base branch
        run: |
          .venv/bin/python tools/glyph_diff.py --base ${{ github.event.pull_request.base.sha }}
          cat build/glyph-diff/summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f build/glyph-diff/overview.png ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Download the **glyph-diff** artifact below for the images." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: glyph-diff
          path: build/glyph-diff/
          if-no-files-found: ignore
